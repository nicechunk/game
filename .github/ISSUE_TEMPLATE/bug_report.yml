name: Bug report
description: Report reproducible incorrect behavior in the current Game client.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Use a disposable Devnet account and remove all secrets from logs and screenshots. Security vulnerabilities belong in the private advisory form.
  - type: input
    id: runtime-version
    attributes:
      label: Client runtime version
      description: Copy the version shown by the loader or runtime metadata.
      placeholder: "0.1.69 or play-bundle-..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      description: Include browser version, operating system, device, and whether this is desktop or mobile.
      placeholder: "Chrome 140, Windows 11, desktop"
    validations:
      required: true
  - type: dropdown
    id: wallet-mode
    attributes:
      label: Wallet mode
      options:
        - Injected wallet
        - NICECHUNK local game wallet
        - Not connected or not applicable
    validations:
      required: true
  - type: dropdown
    id: rpc-mode
    attributes:
      label: RPC mode
      description: Do not include an API key or authenticated endpoint URL.
      options:
        - Public Devnet RPC
        - Helius Devnet RPC
        - Custom Devnet RPC
        - Unknown or not applicable
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the action, selected item or recipe, and state immediately before the failure.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Submit ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Identify whether the failure appeared in the UI, Guardian connection, transaction simulation, submission, or confirmation.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or transaction signature
      description: Remove private keys, wallet backups, session material, RPC keys, and unrelated account data.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed all secrets and used only Devnet evidence.
          required: true
        - label: This report does not contain undisclosed security-impact details.
          required: true
